<svg xmlns="http://www.w3.org/2000/svg" width="600" height="324" viewBox="0 0 600 324" role="img" aria-label="A softer dollar lifts regional commerce (fictional sample)"><rect width="600" height="324" rx="18" fill="#f7f5ef"/><rect x="32" y="32" width="6" height="124" rx="3" fill="#1f7a5a"/><text x="54" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1f7a5a" text-anchor="start" letter-spacing="1.5">LATIN AMERICA</text><text x="54" y="104" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#16202c" text-anchor="start">A softer dollar lifts regional</text><text x="54" y="142" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#16202c" text-anchor="start">commerce</text><text x="54" y="188" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#55606e" text-anchor="start">The sample's dollar index fell 0.6% and Latin American</text><text x="54" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#55606e" text-anchor="start">commerce and fintech names rallied with it.</text><rect x="54" y="230" width="58" height="26" rx="13" fill="#1f7a5a" fill-opacity="0.12"/><text x="83.0" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1f7a5a" text-anchor="middle">MELI</text><line x1="32" y1="278" x2="568" y2="278" stroke="#d9d4c7" stroke-width="1"/><circle cx="44" cy="301" r="9" fill="#0f5e63"/><text x="44" y="305" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">C</text><text x="60" y="305" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#16202c" text-anchor="start">Closing Tape</text><text x="568" y="305" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#55606e" text-anchor="end">Fictional sample</text></svg>
