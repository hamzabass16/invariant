<svg xmlns="http://www.w3.org/2000/svg" width="600" height="324" viewBox="0 0 600 324" role="img" aria-label="Chip tools lead the month's worst day (fictional sample)"><rect width="600" height="324" rx="18" fill="#f7f5ef"/><rect x="32" y="32" width="6" height="124" rx="3" fill="#b4473a"/><text x="54" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#b4473a" text-anchor="start" letter-spacing="1.5">CHIP EQUIPMENT</text><text x="54" y="104" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#16202c" text-anchor="start">Chip tools lead the month's</text><text x="54" y="142" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#16202c" text-anchor="start">worst day</text><text x="54" y="188" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#55606e" text-anchor="start">An invented note in The Tape Desk argued next year's orders</text><text x="54" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#55606e" text-anchor="start">are already in the price; lithography names fell the most.</text><rect x="54" y="230" width="58" height="26" rx="13" fill="#b4473a" fill-opacity="0.12"/><text x="83.0" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#b4473a" text-anchor="middle">ASML</text><line x1="32" y1="278" x2="568" y2="278" stroke="#d9d4c7" stroke-width="1"/><circle cx="44" cy="301" r="9" fill="#0f5e63"/><text x="44" y="305" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">C</text><text x="60" y="305" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#16202c" text-anchor="start">Closing Tape</text><text x="568" y="305" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#55606e" text-anchor="end">Fictional sample</text></svg>
